<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hyder Assistant — Chatwoot Widget Test</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      max-width: 720px;
      margin: 60px auto;
      padding: 0 20px;
      color: #1f2937;
      line-height: 1.6;
    }
    h1 { font-size: 22px; }
  </style>
</head>
<body>

  <h1>Hyder Assistant — Chatwoot Widget Test</h1>
  <p>
    This page embeds the Chatwoot live chat widget. Click the bubble in the
    bottom-right corner to start a conversation.
  </p>

  <!-- Chatwoot Integration Script -->
  <script>
    window.chatwootSettings = { "position": "right", "type": "standard", "launcherTitle": "Chat with us" };
    (function(d,t) {
      var BASE_URL = "http://localhost:3000"; // Changed from 0.0.0.0 to localhost
      var g = d.createElement(t), s = d.getElementsByTagName(t)[0];
      g.src = BASE_URL + "/packs/js/sdk.js";
      g.async = true;
      s.parentNode.insertBefore(g, s);
      g.onload = function() {
        window.chatwootSDK.run({
          websiteToken: 'EEisEciNSqNgdUbGZHFiwApJ',
          baseUrl: BASE_URL
        });
      }
    })(document, "script");
  </script>

</body>
</html>
