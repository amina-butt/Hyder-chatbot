services:
  bot-backend:
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 2048M
    build: .
    container_name: hyder_bot_backend
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./chroma_db:/app/chroma_db
      - ./logs:/app/logs
    networks:
      - chatwoot_network

networks:
  chatwoot_network:
    external: true