services:
  bot-backend:
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 2048M
    build: .
    container_name: hyder_bot_backend
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./chroma_db:/app/chroma_db
      - ./logs:/app/logs
      # Persist the downloaded embedding model so it isn't re-fetched from
      # HuggingFace every time the container is recreated.
      - hf_cache:/home/appuser/.cache/huggingface
    networks:
      - chatwoot_default

volumes:
  hf_cache:

networks:
  chatwoot_default:
    external: true